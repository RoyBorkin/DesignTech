<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write a post — DesignTech</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#57bed2">

  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-body">

  <!-- =================================================== login gate ==== -->
  <section class="gate" id="gate">
    <div class="gate-card">
      <img src="img/logo.png" alt="DesignTech">
      <h1>Editor sign in</h1>
      <p>For lab members only.</p>

      <div class="form-error" id="gate-error"></div>

      <form id="gate-form" autocomplete="off">
        <div class="field">
          <label for="u">Username</label>
          <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="p">Password</label>
          <input id="p" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-red" type="submit">Sign in</button>
      </form>

      <p style="margin:22px 0 0"><a href="index.html" style="font-size:.88rem">&larr; Back to the blog</a></p>
    </div>
  </section>

  <!-- ======================================================= editor ==== -->
  <div id="app" hidden>

    <header class="admin-bar">
      <div class="wrap header-inner">
        <a class="brand" href="index.html">
          <img src="img/logo.png" alt="DesignTech">
          <span class="brand-text" id="mode-label">New post</span>
        </a>

        <div class="header-tools">
          <span class="who" id="who" hidden>
            <span class="avatar" id="who-avatar">?</span>
            <span id="who-name">Signed in</span>
          </span>
          <button class="btn btn-ghost btn-sm" id="google-btn" type="button">Connect Google Drive</button>
          <a class="btn btn-ghost btn-sm" href="index.html">View site</a>
          <button class="btn btn-ghost btn-sm" id="lock-btn" type="button" title="Lock the editor">Lock</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="wrap">

        <div id="setup-notice" hidden></div>

        <div class="admin-cols">

          <!-- ------------------------------------------------- left ---- -->
          <div>
            <div class="panel">
              <label class="sr-only" for="title">Post title</label>
              <input class="title-input" id="title" type="text" placeholder="Post title" maxlength="140">
            </div>

            <div class="panel" style="padding:0;border:0;margin-top:24px">
              <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
                <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
                <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><em>I</em></button>
                <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><span
                    style="text-decoration:underline">U</span></button>
                <span class="sep"></span>
                <button type="button" data-block="h2" title="Heading">H2</button>
                <button type="button" data-block="h3" title="Sub-heading">H3</button>
                <button type="button" data-block="p" title="Normal text">¶</button>
                <span class="sep"></span>
                <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="4" cy="5.5" r="1.3" fill="currentColor" stroke="none" />
                    <circle cx="4" cy="10" r="1.3" fill="currentColor" stroke="none" />
                    <circle cx="4" cy="14.5" r="1.3" fill="currentColor" stroke="none" />
                    <path d="M8 5.5h9M8 10h9M8 14.5h9" stroke-linecap="round" />
                  </svg>
                </button>
                <button type="button" data-cmd="insertOrderedList" title="Numbered list">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M8 5.5h9M8 10h9M8 14.5h9" stroke-linecap="round" />
                    <text x="1.5" y="7.5" font-size="6" fill="currentColor" stroke="none">1</text>
                    <text x="1.5" y="12.2" font-size="6" fill="currentColor" stroke="none">2</text>
                    <text x="1.5" y="16.9" font-size="6" fill="currentColor" stroke="none">3</text>
                  </svg>
                </button>
                <button type="button" data-block="blockquote" title="Quote">&ldquo;</button>
                <span class="sep"></span>
                <button type="button" id="link-btn" title="Add a link">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M8.5 11.5 11.5 8.5M7.5 12.5 6 14a2.8 2.8 0 0 1-4-4l1.5-1.5M12.5 7.5 14 6a2.8 2.8 0 0 0-4-4L8.5 3.5"
                      stroke-linecap="round" />
                  </svg>
                </button>
                <button type="button" id="img-btn" title="Insert a picture">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <rect x="2.5" y="4" width="15" height="12" rx="1.5" />
                    <circle cx="7" cy="8" r="1.4" />
                    <path d="m3.5 14 4-3.5 3 2.5 3-2.5 3 3" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <span class="lbl">Picture</span>
                </button>
                <input type="file" id="img-input" accept="image/*" hidden>
                <span class="sep"></span>
                <button type="button" id="clear-btn" title="Remove formatting">Clear</button>
                <span class="spacer"></span>
                <button type="button" id="preview-btn" title="Preview the post">Preview</button>
              </div>

              <div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true"
                aria-label="Post content" data-empty="true"
                data-placeholder="Write your post here. Use the Picture button to add images."></div>

              <div class="post-body" id="preview" hidden
                style="border:1px solid var(--line);border-radius:0 0 4px 4px;background:#fff;max-width:none;padding:26px 28px">
              </div>
            </div>
          </div>

          <!-- ------------------------------------------------ right ---- -->
          <aside>
            <div class="panel">
              <div class="panel-head">
                <h2 id="publish-head">Publish</h2>
              </div>

              <div class="status" id="status"></div>

              <div class="field">
                <label for="date">Date</label>
                <input id="date" type="date">
              </div>

              <div class="field">
                <label for="author">Author</label>
                <input id="author" type="text" placeholder="DesignTech">
              </div>

              <div class="field">
                <label for="excerpt">Summary for the front page</label>
                <textarea id="excerpt" rows="3" maxlength="300"
                  placeholder="Leave blank to use the opening lines."></textarea>
                <p class="hint">Shown on the post card. <span id="ex-count">0</span>/300</p>
              </div>

              <button class="btn btn-red" id="publish-btn" type="button" style="width:100%">Publish post</button>
              <button class="btn btn-ghost btn-sm" id="cancel-edit" type="button" hidden
                style="width:100%;margin-top:10px">Cancel editing</button>
              <p class="hint" id="publish-hint" style="margin-top:12px">Saves to your Google Drive folder.</p>
            </div>

            <div class="panel">
              <div class="panel-head">
                <h2>Cover picture</h2>
              </div>

              <label class="dropzone" id="cover-drop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                  <path d="M12 16V4m0 0L8 8m4-4 4 4" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M3 15v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3" stroke-linecap="round" />
                </svg>
                <span><strong>Choose a picture</strong><br>or drag one here</span>
                <input type="file" id="cover-input" accept="image/*">
              </label>

              <div class="cover-preview" id="cover-preview" hidden>
                <img id="cover-img" src="" alt="">
                <button class="remove" id="cover-remove" type="button" title="Remove cover">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"
                    aria-hidden="true">
                    <path d="M5 5l10 10M15 5 5 15" stroke-linecap="round" />
                  </svg>
                </button>
              </div>
              <p class="hint">Big pictures are shrunk automatically before upload.</p>
            </div>

            <div class="panel">
              <div class="panel-head">
                <h2>Your posts</h2>
                <button class="icon-btn" id="refresh-btn" type="button" title="Refresh list">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M16.5 10a6.5 6.5 0 1 1-2-4.7" stroke-linecap="round" />
                    <path d="M16.8 3v3h-3" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              <ul class="mini-list" id="post-list">
                <li><span class="t"><span>Connect Google Drive to see your posts.</span></span></li>
              </ul>
            </div>
          </aside>

        </div>
      </div>
    </main>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
